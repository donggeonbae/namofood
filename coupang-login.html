</style></head><body><header><h1>쿠팡 웹앱 로그인</h1><button id="close" type="button">닫기</button></header><main><section class="notice"><div id="status" role="status" aria-live="polite">연결 정보를 확인하고 있습니다…</div><p class="muted">맥미니의 쿠팡 공식 화면을 암호화해서 전달합니다. 비밀번호·인증번호·화면은 서버나 AI에 저장하지 않습니다. 로그인 제한 시간은 5분입니다.</p><p id="error" role="alert"></p><div id="pair-info" hidden><p>처음 사용하는 기기는 맥미니에서 한 번만 승인해야 합니다. 아래 번호가 맥미니 승인 창의 번호와 같은지 확인하세요.</p><div id="code"></div><p class="muted">본인만 사용하는 기기에서 등록하세요. 공용 PC는 등록하지 마세요.</p></div><div class="actions"><button id="start" class="primary" type="button" disabled>쿠팡 로그인 화면 열기</button><button id="verify" type="button" hidden>로그인 완료 확인</button><button id="show-keyboard" type="button" hidden>키보드 열기</button><button id="forget" type="button">이 기기 승인 지우기</button></div></section><div id="screen-box" hidden><img id="screen" alt="암호화된 쿠팡 공식 로그인 화면. 입력칸을 선택하고 직접 입력하세요." draggable="false"></div><textarea id="keyboard" aria-label="쿠팡 원격 키보드" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></main><script type="module" src="coupang-login.js?v=1019-3-web-login"></script></body></html>
